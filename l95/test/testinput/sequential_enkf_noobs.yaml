time window:
  begin: 2010-01-01T21:00:00Z
  length: PT6H

geometry:
  resol: 40

# use 3D for middle of the window
background:
  members from template:
    template:
      date: &date 2010-01-02T00:00:00Z
      filename: Data/forecast.ens.%mem%.2010-01-01T00:00:00Z.P1D.l95
    pattern: %mem%
    nmembers: 5

driver:
  do test prints: true
  update obs config with geometry info: false

observations:
  observers:
  - obs error:
      covariance model: diagonal
    obs localizations:
    - lengthscale: .1
    obs space:
      obsdatain:
        obsfile: Data/noobs.obt
    obs operator: {}

local ensemble DA:
  solver: EAKF
  inflation:
    rtps: 0.5
    rtpp: 0.5
    mult: 1.1

output:
  datadir: Data
  date: *date
  exp: enkf_noobs.%{member}%
  type: an

test:
  reference filename: testoutput/sequential_enkf_noobs.test
