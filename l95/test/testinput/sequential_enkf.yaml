time window:
  begin: 2010-01-01T21:00:00Z
  length: PT6H

geometry:
  resol: 40

# use 3D for middle of the window
background:
  members from template:
    template:
      date: &date 2010-01-02T00:00:00Z
      filename: Data/forecast.ens.%mem%.2010-01-01T00:00:00Z.P1D.l95
    pattern: %mem%
    nmembers: 5

observations:
  observers:
  - obs error:
      covariance model: diagonal
    obs localizations:
      - lengthscale: 0.1
      # NOTE: increase lengthscale if we want this similar to LETKF
    obs space:
      obsdatain:
        obsfile: Data/truth3d.2010-01-02T00:00:00Z.obt
      obsdataout:
        obsfile: Data/enkf.2010-01-02T00:00:00Z.obt
    obs operator: {}

driver:
  do test prints: true

local ensemble DA:
  solver: EAKF
  inflation:
    rtps: 0.5
    rtpp: 0.5
    mult: 1.1

output:
  datadir: Data
  date: *date
  exp: enkf.%{member}%
  type: an

test:
  reference filename: testoutput/sequential_enkf.test
  test output filename: testoutput/sequential_enkf.out
