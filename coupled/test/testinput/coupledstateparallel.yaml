geometry:   # coupled geometry (QG and L95)
  parallel: true
  QG:
    nx: 40
    ny: 20
    depths: [4500.0, 5500.0]
  Lorenz 95:
    resol: 40
  QG exclude variables: [x]
state test:
  # A parallel coupled geometry splits its tasks between the two models and registers
  # named communicators, so it cannot be built again on a single task.
  skip allreduce test: true
  statefile:
    QG:
      date: 2010-01-01T00:00:00Z
      filename: ../../qg/test/Data/truth.fc.2009-12-15T00:00:00Z.P17D.nc
      state variables: [q, u]
    Lorenz 95:
      date: 2010-01-01T00:00:00Z
      filename: ../../l95/test/Data/forecast.an.2010-01-01T00:00:00Z.l95
  write then read test:
    state write:
      QG:
        datadir: Data
        exp: coupled_state_test_qg_parallel
        type: fc
        date: 2010-01-01T00:00:00Z
      Lorenz 95:
        datadir: Data
        exp: coupled_state_test_l95_parallel
        type: fc
        date: 2010-01-01T00:00:00Z
    state read:
      QG:
        date: 2010-01-01T00:00:00Z
        filename: Data/coupled_state_test_qg_parallel.fc.2010-01-01T00:00:00Z.PT0S.nc
        state variables: [q, u]
      Lorenz 95:
        date: 2010-01-01T00:00:00Z
        filename: Data/coupled_state_test_l95_parallel.fc.2010-01-01T00:00:00Z.PT0S.l95

  remove fields variables: [u]
  test zero norm after adding fields: false
  norm file: 7114429.14267
  tolerance: 1.e-3
  date: 2010-01-01T00:00:00Z

